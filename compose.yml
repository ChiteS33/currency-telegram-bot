services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-currency_bot}
      POSTGRES_USER: ${POSTGRES_USER:-currency_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    init: true
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
